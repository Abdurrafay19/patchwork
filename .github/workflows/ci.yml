name: CI

# Runs on every push and PR. Scope is intentionally limited to code that doesn't require Ollama or a GPU
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        run: ruff check patchwork/ tests/

      - name: Ruff format check
        run: ruff format --check patchwork/ tests/

      - name: Mypy strict
        run: mypy --strict patchwork/

      - name: Pytest with coverage
        run: pytest tests/ -v --cov=patchwork --cov-report=term-missing

  graph-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt && pip install pytest
      - run: pytest tests/test_graph.py -v -m "not requires_ollama"
